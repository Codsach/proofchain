name: ProofChain CI Pipeline

on:
  push:
    branches: [ main, master, dev, "feature/**" ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Next.js Web Application (Lint, Typecheck & Build)
  # -------------------------------------------------------------
  web-app:
    name: Next.js Frontend & API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_CONTRACT_ADDRESS: "0x0000000000000000000000000000000000000000"
          MONGODB_URI: "mongodb://localhost:27017/proofchain_test"
          JWT_SECRET: "ci_test_jwt_secret_key_1234567890_proofchain"
          REFRESH_TOKEN_SECRET: "ci_test_refresh_token_secret_key_1234567890_proofchain"
          POLYGON_RPC_URL: "https://rpc-amoy.polygon.technology"
          FASTAPI_URL: "http://localhost:8000"
          INTERNAL_AI_KEY: "ci_test_ai_key"
          NEXT_TELEMETRY_DISABLED: 1

  # -------------------------------------------------------------
  # Job 2: Solidity Smart Contracts (Compile & Hardhat Unit Tests)
  # -------------------------------------------------------------
  smart-contracts:
    name: Hardhat Smart Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install Smart Contract Dependencies
        run: |
          cd contracts
          npm ci

      - name: Compile Smart Contracts
        run: |
          cd contracts
          npm run compile

      - name: Run Hardhat Unit Tests
        run: |
          cd contracts
          npm run test

  # -------------------------------------------------------------
  # Job 3: AI Service (Python Requirements, Lint & Pytest)
  # -------------------------------------------------------------
  ai-service:
    name: FastAPI AI Forensic Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic-dev mediainfo

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-service/requirements.txt
          pip install pytest flake8

      - name: Run Python Lint (flake8)
        run: |
          flake8 ai-service --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Run Pytest Tests
        run: |
          cd ai-service
          pytest

  # -------------------------------------------------------------
  # Job 4: Docker Container Build Verification
  # -------------------------------------------------------------
  docker-build:
    name: Docker Container Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web App Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: proofchain-web:ci-test

      - name: Build AI Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          push: false
          tags: proofchain-ai:ci-test

  # -------------------------------------------------------------
  # Job 5: CI Gate (Pass status check for PRs & Branch Protection)
  # -------------------------------------------------------------
  ci-gate:
    name: CI Pipeline Status Gate
    needs: [web-app, smart-contracts, ai-service, docker-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Pipeline Results
        run: |
          if [[ "${{ needs.web-app.result }}" == "failure" || \
                "${{ needs.smart-contracts.result }}" == "failure" || \
                "${{ needs.ai-service.result }}" == "failure" || \
                "${{ needs.docker-build.result }}" == "failure" ]]; then
            echo "CI Pipeline Failed!"
            exit 1
          fi
          echo "All CI Pipeline jobs completed successfully!"
